name: Runtime

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: runtime
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Compile and check entrypoints
        run: |
          python -m compileall -q runtime
          python skills/coordinate-shared-workspace/scripts/coord.py --help
          python skills/observe-dev-mesh/scripts/console.py --help
